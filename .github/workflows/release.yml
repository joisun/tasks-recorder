name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  release:
    runs-on: macos-latest
    timeout-minutes: 20
    steps:
      - name: Check out repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 24
          cache: npm

      - name: Install development dependencies
        run: npm ci

      - name: Verify tag and project version
        run: |
          package_version="$(node -p 'require("./package.json").version')"
          test "$GITHUB_REF_NAME" = "v$package_version"

      - name: Build and test
        run: |
          npm run build
          npm run build:adapters
          npm run check
          npm test

      - name: Package release assets
        run: |
          npm run package:release
          cp install.sh release/install.sh
          chmod 755 release/install.sh
          cd release
          shasum -a 256 \
            tasks-recorder-macos.tar.gz \
            tasks-recorder-codex-adapter.tar.gz \
            tasks-recorder-claude-adapter.tar.gz \
            install.sh > SHA256SUMS

      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" \
            release/tasks-recorder-macos.tar.gz \
            release/tasks-recorder-codex-adapter.tar.gz \
            release/tasks-recorder-claude-adapter.tar.gz \
            release/install.sh \
            release/SHA256SUMS \
            --verify-tag \
            --generate-notes \
            --title "Tasks Recorder $GITHUB_REF_NAME"
