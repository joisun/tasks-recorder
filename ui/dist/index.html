  .context-path,.session-id-cell{height:44px}
  .context-path[data-full-path]{box-shadow:inset 0 -1px color-mix(in oklab,var(--accent-hover) 34%,transparent);cursor:pointer}
  .session-copy{width:44px;height:44px;min-width:44px;flex-basis:44px;opacity:.72}
  .details-close,.project-inbox-identity button{width:auto;min-width:44px;height:44px;min-height:44px}
  .details-tab,.details-actions button,.child-form-actions button,.details-form>button,.details-copy,.inbox-actions button,.project-inbox-assign button{min-width:44px;min-height:44px}
  .inbox-selection-bar label,.inbox-select{min-width:44px;min-height:44px;align-items:center}
  .inbox-filters input,.inbox-filters select,.inbox-actions select,.project-inbox-assign select{min-height:44px}
  .gantt-empty-state{inset:53px 0 0}
  .gantt-empty-state button{min-height:44px}
}

/* Session recall keeps the task label primary while making the terminal action discoverable. */
.task-cell{display:flex;width:100%;min-width:0;height:100%;align-items:center;gap:2px;overflow:hidden}
.task-cell .task-label{width:auto;min-width:0;flex:1 1 auto}
.task-resume{display:inline-grid;width:24px;height:24px;min-width:24px;flex:0 0 24px;padding:0;place-items:center;border:0;border-radius:4px;background:transparent;color:var(--meta);cursor:pointer;opacity:.62;transition:background 120ms,color 120ms,opacity 120ms}
.task-cell:hover .task-resume,.task-resume:focus-visible{color:var(--muted);opacity:1}
.task-resume:hover{background:color-mix(in oklab,var(--accent) 16%,transparent);color:var(--accent-hover)}
.task-resume:focus-visible{outline:2px solid var(--accent-hover);outline-offset:-2px}
.task-resume:disabled{cursor:wait;opacity:.7}
.task-resume.is-launching svg{animation:resume-pulse 800ms ease-in-out infinite alternate}
@keyframes resume-pulse{to{transform:translateY(-1px);color:var(--accent-hover);opacity:.45}}

/* Extensible application settings shell, visually aligned with native terminal preferences. */
.settings-toggle{display:inline-grid;width:30px;height:30px;min-width:30px;flex:0 0 30px;padding:0;place-items:center;border:1px solid var(--border-soft);border-radius:6px;background:color-mix(in oklab,var(--surface) 72%,transparent);color:var(--meta);cursor:pointer}
.settings-toggle:hover{border-color:var(--border);background:var(--surface-hover);color:var(--fg-2)}
.settings-toggle:focus-visible{outline:2px solid var(--accent-hover);outline-offset:1px}
.settings-backdrop{position:fixed;z-index:1290;inset:0;background:rgba(4,5,7,.68);backdrop-filter:blur(4px)}
.settings-backdrop[hidden],.settings-dialog-layer[hidden]{display:none}
.settings-dialog-layer{position:fixed;z-index:1300;top:50%;left:50%;width:min(820px,calc(100vw - 40px));height:min(570px,calc(100dvh - 48px));overflow:hidden;transform:translate(-50%,-50%);border:1px solid color-mix(in oklab,var(--fg) 14%,var(--border));border-radius:14px;background:#151619;box-shadow:0 32px 90px rgba(0,0,0,.62),0 0 0 1px rgba(255,255,255,.025)}
.settings-shell{display:grid;width:100%;height:100%;grid-template-columns:220px minmax(0,1fr);color:var(--fg-2)}
.settings-sidebar{display:flex;min-width:0;flex-direction:column;padding:28px 16px 18px;border-right:1px solid var(--border-soft);background:color-mix(in oklab,#1b1c1f 94%,var(--bg))}
.settings-brand{padding:0 12px 25px}.settings-kicker{color:var(--meta);font:600 9px var(--font-mono);letter-spacing:.1em;text-transform:uppercase}.settings-brand h2{margin:6px 0 0;color:var(--fg);font-size:20px;font-weight:620;letter-spacing:-.025em}
.settings-navigation{display:grid;gap:4px}.settings-nav-item{display:flex;width:100%;height:38px;align-items:center;gap:10px;padding:0 12px;border:0;border-radius:7px;background:transparent;color:var(--muted);font-size:12px;text-align:left;cursor:default}.settings-nav-item.is-active{background:color-mix(in oklab,var(--fg) 8%,transparent);color:var(--fg-2)}
.settings-nav-icon,.settings-section-icon{position:relative;width:16px;height:16px;flex:0 0 16px;border:1px solid currentColor;border-radius:50%;opacity:.8}.settings-nav-icon::after,.settings-section-icon::after{position:absolute;inset:4px;border:1px solid currentColor;border-radius:50%;content:""}
.settings-version{margin:auto 12px 0;color:var(--meta);font:9px var(--font-mono)}
.settings-content{position:relative;min-width:0;overflow:auto;padding:44px 48px 36px;background:linear-gradient(180deg,#151619,#121316)}
.settings-close{position:absolute;top:16px;right:16px;display:grid;width:30px;height:30px;padding:0;place-items:center;border:0;border-radius:6px;background:transparent;color:var(--meta);font-size:20px;line-height:1;cursor:pointer}.settings-close:hover{background:color-mix(in oklab,var(--fg) 6%,transparent);color:var(--fg)}.settings-close:focus-visible{outline:2px solid var(--accent-hover);outline-offset:-2px}
.settings-heading{max-width:520px}.settings-heading h3{margin:7px 0 0;color:var(--fg);font-size:23px;font-weight:620;letter-spacing:-.03em}.settings-heading p{margin:8px 0 0;color:var(--muted);font-size:11.5px;line-height:1.55}
.settings-group{margin-top:30px;overflow:hidden;border:1px solid var(--border);border-radius:10px;background:color-mix(in oklab,var(--surface-raised) 58%,transparent);box-shadow:inset 0 1px rgba(255,255,255,.018)}
.settings-group-heading{display:flex;align-items:center;gap:11px;padding:18px 20px;border-bottom:1px solid var(--border-soft)}.settings-section-icon{color:var(--accent-hover)}.settings-group-heading h4{margin:0;color:var(--fg-2);font-size:12.5px;font-weight:590}.settings-group-heading p{margin:4px 0 0;color:var(--meta);font-size:10px}
.settings-row{display:grid;grid-template-columns:minmax(0,1fr) 210px;align-items:center;gap:24px;padding:20px}.settings-row label{display:grid;gap:5px}.settings-row label strong{color:var(--fg-2);font-size:12px;font-weight:560}.settings-row label span{color:var(--muted);font-size:10.5px}.settings-row select{width:100%;height:36px;padding:0 32px 0 11px;border:1px solid var(--border);border-radius:7px;background:#222327;color:var(--fg-2);font-size:11.5px;outline:0;cursor:pointer}.settings-row select:hover:not(:disabled),.settings-row select:focus{border-color:color-mix(in oklab,var(--accent-hover) 58%,var(--border))}.settings-row select:disabled{cursor:wait;opacity:.58}
.settings-meta{display:flex;min-width:0;align-items:center;justify-content:space-between;gap:12px;padding:11px 20px;border-top:1px solid var(--border-soft);background:color-mix(in oklab,var(--bg) 36%,transparent)}.settings-meta code{overflow:hidden;color:var(--meta);font:9px var(--font-mono);text-overflow:ellipsis;white-space:nowrap}.settings-availability{display:inline-flex;align-items:center;gap:6px;color:var(--success);font-size:9.5px;white-space:nowrap}.settings-availability i{width:6px;height:6px;border-radius:50%;background:currentColor;box-shadow:0 0 0 3px color-mix(in oklab,currentColor 12%,transparent)}.settings-availability.is-unavailable{color:var(--warn)}
.settings-security-note{margin:18px 2px 0;color:var(--meta);font-size:10px;line-height:1.55}.settings-message{display:none;margin-top:14px;padding:9px 11px;border:1px solid color-mix(in oklab,var(--success) 25%,var(--border));border-radius:6px;background:color-mix(in oklab,var(--success) 7%,transparent);color:var(--success);font-size:10.5px}.settings-message.is-visible{display:block}.settings-message.is-error{border-color:color-mix(in oklab,var(--danger) 30%,var(--border));background:color-mix(in oklab,var(--danger) 7%,transparent);color:var(--danger)}

@media(max-width:720px){
  .task-resume{width:44px;height:44px;min-width:44px;flex-basis:44px;opacity:.8}
  .settings-toggle{width:44px;height:44px;min-width:44px;flex-basis:44px}
  .settings-dialog-layer{inset:0;width:100vw;height:100dvh;transform:none;border:0;border-radius:0}
  .settings-shell{grid-template-columns:1fr;grid-template-rows:auto minmax(0,1fr)}
  .settings-sidebar{display:grid;grid-template-columns:minmax(0,1fr) auto;align-items:center;padding:15px 16px;border-right:0;border-bottom:1px solid var(--border-soft)}
  .settings-brand{padding:0}.settings-brand h2{font-size:17px}.settings-navigation{display:none}.settings-version{margin:0}
  .settings-content{padding:38px 18px 24px}.settings-close{top:9px;right:10px;width:44px;height:44px}
  .settings-heading h3{font-size:21px}.settings-group{margin-top:22px}.settings-row{grid-template-columns:1fr;gap:12px;padding:17px}.settings-row select{height:44px}.settings-meta{align-items:flex-start;flex-direction:column}.settings-meta code{max-width:100%}
}
