.tasks-gantt .wx-baseline {
  height: 4px !important;
  border: 1px dashed var(--accent-strong);
  @supports (color: color-mix(in lab, red, red)) {
    border: 1px dashed color-mix(in oklab, var(--accent-strong) 62%, transparent);
  }
  border-radius: 2px;
  background: transparent !important;
  opacity: 0.72;
}
.tasks-empty-state {
  display: grid;
  height: 100%;
  place-content: center;
  gap: 4px;
  color: var(--text-muted);
  text-align: center;
  font-size: 12px;
}
.tasks-empty-state strong {
  color: var(--text-primary);
  font-size: 13px;
}
.tasks-workspace__unavailable {
  display: flex;
  width: min(360px, calc(100% - 32px));
  margin: 24px auto;
  flex-direction: column;
  gap: 4px;
  padding: 12px;
  border: 1px solid var(--danger);
  @supports (color: color-mix(in lab, red, red)) {
    border: 1px solid color-mix(in oklab, var(--danger) 40%, var(--border-subtle));
  }
  border-radius: var(--radius-md);
  color: var(--text-muted);
  font-size: 12px;
}
.tasks-workspace__unavailable strong {
  color: var(--text-primary);
  font-size: 13px;
}
.task-details-sheet {
  top: 60px !important;
  right: 12px !important;
  bottom: 12px !important;
  height: auto !important;
  gap: 0 !important;
  border: 1px solid var(--border-strong) !important;
  border-radius: 10px;
  background: var(--surface-1);
  @supports (color: color-mix(in lab, red, red)) {
    background: color-mix(in oklab, var(--surface-1) 96%, var(--surface-0));
  }
  box-shadow: -16px 0 40px oklch(0.05 0.01 260 / 28%);
}
.task-details-sheet__message {
  margin: 10px 16px 0;
  padding: 8px 10px;
  border: 1px solid var(--danger);
  @supports (color: color-mix(in lab, red, red)) {
    border: 1px solid color-mix(in oklab, var(--danger) 42%, var(--border-subtle));
  }
  border-radius: 6px;
  color: var(--danger);
  @supports (color: color-mix(in lab, red, red)) {
    color: color-mix(in oklab, var(--danger) 76%, var(--text-primary));
  }
  background: var(--danger);
  @supports (color: color-mix(in lab, red, red)) {
    background: color-mix(in oklab, var(--danger) 8%, transparent);
  }
  font-size: 11px;
}
.task-details-sheet__tabs {
  min-height: 0;
  margin-top: 10px;
  overflow: hidden;
}
.task-details-sheet__tabs > [data-slot="tabs-list"] {
  width: calc(100% - 32px);
  margin: 0 16px;
  justify-content: flex-start;
  border-bottom: 1px solid var(--border-subtle);
}
.task-details-sheet__tabs [data-slot="tabs-trigger"] {
  flex: 0 0 auto;
  border-radius: 0;
  box-shadow: none;
}
.task-details-sheet__tabs [data-slot="tabs-trigger"][data-state="active"]::after {
  position: absolute;
  right: 7px;
  bottom: -3px;
  left: 7px;
  height: 2px;
  border-radius: 999px;
  background: var(--accent-strong);
  content: "";
}
.task-details-sheet__panel {
  height: 100%;
  min-height: 0;
  overflow: auto;
  padding: 14px 16px 20px;
}
.task-details-summary {
  display: grid;
  grid-template-columns: repeat(2, minmax(0, 1fr));
  gap: 14px 18px;
}
.task-details-field {
  display: flex;
  min-width: 0;
  flex-direction: column;
  gap: 5px;
}
.task-details-field--wide {
  grid-column: 1 / -1;
}
.task-details-field > span,
.task-details-metrics dt {
  color: var(--text-muted);
  font-size: 10px;
  font-weight: 600;
  letter-spacing: 0.02em;
}
.task-details-field p {
  margin: 0;
  color: var(--text-primary);
  font-size: 12px;
  line-height: 1.55;
  white-space: pre-wrap;
}
.task-details-field select {
  height: 30px;
  padding: 0 8px;
  border: 1px solid var(--border-subtle);
  border-radius: 6px;
  color: var(--text-primary);
  background: var(--surface-2);
  font-size: 12px;
}
.task-details-field .gantt-context-cell {
  height: 30px;
  border: 1px solid var(--border-subtle);
  background: var(--surface-2);
  @supports (color: color-mix(in lab, red, red)) {
    background: color-mix(in oklab, var(--surface-2) 44%, transparent);
  }
}
.task-details-metrics {
  display: grid;
  grid-column: 1 / -1;
  grid-template-columns: repeat(2, minmax(0, 1fr));
  gap: 1px;
  margin: 2px 0 0;
  overflow: hidden;
  border: 1px solid var(--border-subtle);
  border-radius: 7px;
  background: var(--border-subtle);
}
.task-details-metrics > div {
  padding: 9px 10px;
  background: var(--surface-1);
}
.task-details-metrics dd {
  margin: 3px 0 0;
  color: var(--text-primary);
  font: 500 11px ui-monospace, SFMono-Regular, Menlo, monospace;
}
.task-details-list,
.task-activity-list {
  display: flex;
  margin: 0;
  flex-direction: column;
  gap: 7px;
  padding: 0;
  list-style: none;
}
.task-details-list > li {
  padding: 10px;
  border: 1px solid var(--border-subtle);
  border-radius: 7px;
  background: var(--surface-2);
  @supports (color: color-mix(in lab, red, red)) {
    background: color-mix(in oklab, var(--surface-2) 42%, transparent);
  }
}
.task-details-list > li > div:first-child {
  display: flex;
  justify-content: space-between;
  color: var(--text-primary);
  font-size: 11px;
}
.task-details-list p,
.task-details-list small {
  display: block;
  margin: 5px 0 0;
  overflow: hidden;
  color: var(--text-muted);
  font: 450 10px ui-monospace, SFMono-Regular, Menlo, monospace;
  text-overflow: ellipsis;
  white-space: nowrap;
}
.task-activity-list > li {
  display: grid;
  grid-template-columns: 8px minmax(0, 1fr);
  gap: 8px;
  align-items: start;
  padding: 7px 0;
}
.task-activity-list > li > span {
  width: 6px;
  height: 6px;
  margin-top: 4px;
  border-radius: 50%;
  background: var(--accent-strong);
}
.task-activity-list strong,
.task-activity-list small {
  display: block;
  font-size: 11px;
}
.task-activity-list small {
  margin-top: 3px;
  color: var(--text-muted);
  font-size: 10px;
}
.task-details-list .is-empty,
.task-activity-list .is-empty {
  display: block;
  border: 0;
  color: var(--text-muted);
  background: transparent;
  text-align: center;
  font-size: 11px;
}
.task-details-sheet__actions {
  flex-direction: row !important;
  justify-content: flex-end;
  padding-top: 12px;
  border-top: 1px solid var(--border-subtle);
}
@keyframes connection-spin {
  to {
    transform: rotate(360deg);
  }
}
@media (max-width: 720px) {
  .app-shell {
    padding: 8px;
  }
  .app-shell__header {
    grid-template-columns: auto 1fr auto;
  }
  .app-shell__brand h1,
  .app-shell__task-count,
  .app-navigation__migration,
  .connection-status span {
    position: absolute;
    width: 1px;
    height: 1px;
    overflow: hidden;
    clip: rect(0 0 0 0);
    white-space: nowrap;
    clip-path: inset(50%);
  }
  .app-shell__brand,
  .app-shell__actions {
    padding-inline: 8px;
  }
}
@media (max-width: 900px) {
  .tasks-view {
    grid-template-rows: auto minmax(0, 1fr);
  }
  .tasks-toolbar {
    min-height: 40px;
    flex-wrap: wrap;
  }
  .tasks-toolbar__search {
    width: auto;
    flex: 1 1 220px;
  }
  .tasks-toolbar__group {
    margin-left: 0;
  }
}
