:root {
  --surface-0: oklch(0.145 0.008 260);
  --surface-1: oklch(0.175 0.01 260);
  --surface-2: oklch(0.21 0.012 260);
  --surface-raised: oklch(0.195 0.012 260);
  --border-subtle: oklch(0.31 0.012 260 / 58%);
  --border-strong: oklch(0.42 0.014 260 / 72%);
  --text-primary: oklch(0.93 0.008 260);
  --text-muted: oklch(0.68 0.014 260);
  --accent: oklch(0.72 0.13 275);
  --accent-strong: oklch(0.78 0.14 275);
  --accent-contrast: oklch(0.16 0.025 275);
  --danger: oklch(0.69 0.16 24);
  --success: oklch(0.72 0.13 155);
  --warning: oklch(0.78 0.13 75);
  --shadow-panel: 0 18px 48px oklch(0.05 0.01 260 / 42%);
  --row-height: 36px;
  --control-height: 32px;
  --radius: 8px;
  --background: var(--surface-0);
  --foreground: var(--text-primary);
  --card: var(--surface-1);
  --card-foreground: var(--text-primary);
  --popover: var(--surface-raised);
  --popover-foreground: var(--text-primary);
  --primary: var(--accent);
  --primary-foreground: var(--accent-contrast);
  --secondary: var(--surface-2);
  --secondary-foreground: var(--text-primary);
  --muted: var(--surface-2);
  --muted-foreground: var(--text-muted);
  --accent-foreground: var(--text-primary);
  --destructive: var(--danger);
  --border: var(--border-subtle);
  --input: var(--border-strong);
  --ring: var(--accent);
}
@media (prefers-reduced-motion: reduce) {
  *, *::before, *::after {
    scroll-behavior: auto !important;
    animation-duration: 0.01ms !important;
    animation-iteration-count: 1 !important;
    transition-duration: 0.01ms !important;
  }
}
@layer base {
  * {
    border-color: var(--border);
    outline-color: var(--ring);
    @supports (color: color-mix(in lab, red, red)) {
      outline-color: color-mix(in oklab, var(--ring) 50%, transparent);
    }
    box-sizing: border-box;
  }
  html {
    font-family: ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    font-synthesis: none;
  }
  body {
    background-color: var(--background);
    color: var(--foreground);
    min-width: 320px;
    min-height: 100vh;
    margin: 0;
  }
  button:not(:disabled),
  [role="button"]:not(:disabled) {
    cursor: pointer;
  }
}
button,
input,
textarea,
select {
  font: inherit;
}
.app-shell {
  display: grid;
  height: 100vh;
  min-height: 100vh;
  grid-template-rows: 48px minmax(0, 1fr);
  padding: 12px;
  overflow: hidden;
  background: var(--surface-0);
}
.app-shell__header {
  display: grid;
  min-width: 0;
  grid-template-columns: minmax(180px, 1fr) auto minmax(180px, 1fr);
  align-items: center;
  border: 1px solid var(--border-subtle);
  border-bottom: 0;
  border-radius: var(--radius-lg) var(--radius-lg) 0 0;
  background: var(--surface-1);
}
.app-shell__brand,
.app-shell__actions {
  display: flex;
  min-width: 0;
  align-items: center;
  gap: 8px;
  padding-inline: 12px;
}
.app-shell__brand h1 {
  overflow: hidden;
  margin: 0;
  color: var(--text-primary);
  font-size: 13px;
  font-weight: 650;
  letter-spacing: -0.01em;
  text-overflow: ellipsis;
  white-space: nowrap;
}
.app-shell__mark {
  display: grid;
  width: 24px;
  height: 24px;
  flex: 0 0 auto;
  place-items: center;
  border-radius: 6px;
  color: var(--accent-strong);
  background: var(--accent);
  @supports (color: color-mix(in lab, red, red)) {
    background: color-mix(in oklab, var(--accent) 12%, transparent);
  }
}
.app-shell__mark svg {
  width: 14px;
  height: 14px;
}
.app-navigation {
  display: flex;
  height: 32px;
  align-items: center;
  gap: 2px;
  padding: 3px;
  border: 1px solid var(--border-subtle);
  border-radius: 7px;
  background: var(--surface-2);
  @supports (color: color-mix(in lab, red, red)) {
    background: color-mix(in oklab, var(--surface-2) 70%, transparent);
  }
}
.app-navigation__item {
  display: inline-flex;
  height: 24px;
  align-items: center;
  gap: 6px;
  padding: 0 9px;
  border: 0;
  border-radius: 5px;
  color: var(--text-muted);
  background: transparent;
  font-size: 12px;
  font-weight: 580;
  white-space: nowrap;
}
.app-navigation__item svg {
  width: 13px;
  height: 13px;
}
.app-navigation__item.is-active {
  color: var(--text-primary);
  background: var(--surface-raised);
  box-shadow: 0 1px 2px oklch(0.05 0.01 260 / 18%);
}
.app-navigation__item:focus-visible {
  outline: 2px solid var(--accent);
  @supports (color: color-mix(in lab, red, red)) {
    outline: 2px solid color-mix(in oklab, var(--accent) 72%, transparent);
  }
  outline-offset: 1px;
}
.app-navigation__item:disabled {
  cursor: default;
  opacity: 0.48;
}
.app-navigation__migration {
  color: var(--text-muted);
  font-size: 10px;
  font-weight: 500;
}
.app-shell__actions {
  justify-content: flex-end;
}
.app-shell__task-count {
  color: var(--text-muted);
  font-size: 11px;
  font-variant-numeric: tabular-nums;
  white-space: nowrap;
}
.connection-status {
  display: inline-flex;
  height: 26px;
  align-items: center;
  gap: 5px;
  padding: 0 7px;
  border-radius: 6px;
  color: var(--text-muted);
  font-size: 11px;
  white-space: nowrap;
}
.connection-status svg {
  width: 12px;
  height: 12px;
}
.connection-status[data-state="open"] svg {
  color: var(--success);
}
.connection-status[data-state="connecting"] svg {
  color: var(--warning);
  animation: connection-spin 1.1s linear infinite;
}
.connection-status[data-state="closed"] svg {
  color: var(--danger);
}
.app-shell__main {
  min-width: 0;
  min-height: 0;
  overflow: hidden;
  border: 1px solid var(--border-subtle);
  border-radius: 0 0 var(--radius-lg) var(--radius-lg);
  background: var(--surface-1);
}
.tasks-workspace {
  width: 100%;
  height: 100%;
  min-height: 0;
}
.tasks-gantt,
.tasks-gantt__theme {
  width: 100%;
  height: 100%;
  min-width: 0;
  min-height: 0;
  overflow: hidden;
}
.tasks-gantt {
  --wx-background: var(--surface-1);
  --wx-color-font: var(--text-primary);
  --wx-font-family: ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
  --wx-border: 1px solid var(--border-subtle);
  --wx-gantt-border-color: var(--border-subtle);
  --wx-gantt-border: 1px solid var(--border-subtle);
  --wx-grid-body-row-border: 1px solid var(--border-subtle);
  --wx-grid-body-cell-border: 1px solid transparent;
  --wx-grid-header-font: 600 10.5px var(--wx-font-family);
  --wx-grid-header-font-color: var(--text-muted);
  --wx-grid-header-text-transform: none;
  --wx-grid-body-font: 430 12px var(--wx-font-family);
  --wx-grid-body-font-color: var(--text-primary);
  --wx-timescale-font: 560 10px ui-monospace, SFMono-Regular, Menlo, monospace;
  --wx-timescale-font-color: var(--text-muted);
  --wx-timescale-border: 1px solid var(--border-subtle);
  --wx-timescale-shadow: none;
  --wx-gantt-select-color: var(--accent);
  @supports (color: color-mix(in lab, red, red)) {
    --wx-gantt-select-color: color-mix(in oklab, var(--accent) 12%, transparent);
  }
  --wx-gantt-holiday-background: var(--surface-2);
  @supports (color: color-mix(in lab, red, red)) {
    --wx-gantt-holiday-background: color-mix(in oklab, var(--surface-2) 52%, var(--surface-1));
  }
}
.tasks-gantt .wx-gantt,
.tasks-gantt .wx-layout,
.tasks-gantt .wx-table-container,
.tasks-gantt .wx-chart,
.tasks-gantt .wx-scale {
  background: var(--surface-1);
  color: var(--text-primary);
  font-family: var(--wx-font-family);
}
.tasks-gantt .wx-header {
  border-bottom: 1px solid var(--border-subtle);
  background: var(--surface-1);
  @supports (color: color-mix(in lab, red, red)) {
    background: color-mix(in oklab, var(--surface-1) 88%, var(--surface-2));
  }
}
.tasks-gantt .wx-header .wx-cell {
  color: var(--text-muted);
  letter-spacing: 0.005em;
}
.tasks-gantt .wx-row {
  background: var(--surface-1);
}
.tasks-gantt .wx-row:hover .wx-cell {
  background: var(--surface-2);
  @supports (color: color-mix(in lab, red, red)) {
    background: color-mix(in oklab, var(--surface-2) 62%, var(--surface-1));
  }
}
.tasks-gantt .wx-cell {
  border-color: var(--border-subtle);
}
.tasks-gantt .wx-toggle-icon,
.tasks-gantt .wx-toggle-placeholder {
  width: 22px;
  min-width: 22px;
  height: 30px;
  margin: 0;
}
.tasks-gantt .wx-toggle-icon {
  display: inline-grid;
  place-items: center;
  color: var(--text-muted);
  font-size: 13px;
}
.gantt-task-cell,
.gantt-context-cell,
.gantt-activity-cell,
.gantt-group-progress,
.gantt-leaf-status {
  display: flex;
  width: 100%;
  min-width: 0;
  height: 30px;
  align-items: center;
}
.gantt-task-cell__title,
.gantt-context-cell {
  overflow: hidden;
  text-overflow: ellipsis;
  white-space: nowrap;
}
.gantt-task-cell__title {
  color: var(--text-primary);
}
.gantt-task-cell[data-entity-type="project"] .gantt-task-cell__title,
.gantt-task-cell[data-entity-type="main_task"] .gantt-task-cell__title {
  font-weight: 610;
}
.gantt-activity-cell {
  justify-content: flex-end;
  color: var(--text-muted);
  font: 500 10px ui-monospace, SFMono-Regular, Menlo, monospace;
  font-variant-numeric: tabular-nums;
}
.gantt-context-cell {
  color: var(--text-muted);
  font: 450 10.5px ui-monospace, SFMono-Regular, Menlo, monospace;
}
.gantt-context-cell.is-empty {
  color: var(--text-muted);
  @supports (color: color-mix(in lab, red, red)) {
    color: color-mix(in oklab, var(--text-muted) 52%, transparent);
  }
}
.gantt-group-progress {
  justify-content: center;
  gap: 7px;
  color: var(--text-muted);
  font-size: 10.5px;
  font-variant-numeric: tabular-nums;
}
.gantt-group-progress__track {
  width: 42px;
  height: 4px;
  flex: 0 0 42px;
  overflow: hidden;
  border-radius: 999px;
  background: var(--text-muted);
  @supports (color: color-mix(in lab, red, red)) {
    background: color-mix(in oklab, var(--text-muted) 22%, transparent);
  }
}
.gantt-group-progress__track > span {
  display: block;
  height: 100%;
  border-radius: inherit;
  background: var(--accent-strong);
}
.gantt-leaf-status {
  justify-content: center;
  gap: 7px;
  color: var(--text-muted);
  font-size: 10.5px;
}
.gantt-leaf-status > span:first-child {
  width: 7px;
  height: 7px;
  flex: 0 0 7px;
  border-radius: 50%;
  background: var(--text-muted);
}
.gantt-leaf-status[data-indicator="ring"] > span:first-child {
  width: 12px;
  height: 12px;
  flex-basis: 12px;
  border: 2px solid currentColor;
  background: transparent;
}
.gantt-leaf-status[data-status="active"] > span:first-child {
  color: var(--warning);
  background-color: var(--warning);
}
.gantt-leaf-status[data-status="waiting"] > span:first-child {
  color: var(--accent-strong);
  background-color: var(--accent-strong);
}
.gantt-leaf-status[data-status="blocked"] > span:first-child {
  color: var(--danger);
  background-color: var(--danger);
}
.gantt-leaf-status[data-status="done"] > span:first-child {
  color: var(--success);
  background-color: var(--success);
}
.gantt-leaf-status[data-indicator="ring"] > span:first-child {
  background-color: transparent;
}
.tasks-gantt .wx-bar {
  height: 18px !important;
  overflow: visible;
  transform: translateY(2px);
  border: 0;
  border-radius: 3px;
  background: var(--accent);
  @supports (color: color-mix(in lab, red, red)) {
    background: color-mix(in oklab, var(--accent) 28%, var(--surface-2));
  }
  box-shadow: inset 0 0 0 1px var(--text-primary);
  @supports (color: color-mix(in lab, red, red)) {
    box-shadow: inset 0 0 0 1px color-mix(in oklab, var(--text-primary) 9%, transparent);
  }
}
.tasks-gantt .wx-progress-wrapper {
  border-radius: inherit;
  background: var(--accent-strong);
  opacity: 0.68;
}
.gantt-task-bar {
  position: relative;
  width: 100%;
  height: 100%;
}
.tasks-gantt .wx-bar:has(.gantt-task-bar[data-entity-type="project"]),
.tasks-gantt .wx-bar:has(.gantt-task-bar[data-entity-type="main_task"][data-task-kind="summary"]) {
  height: 20px !important;
  transform: translateY(1px);
  background: transparent;
  box-shadow: none;
}
.tasks-gantt .wx-bar:has(.gantt-task-bar[data-entity-type="project"]) .wx-progress-wrapper,
.tasks-gantt .wx-bar:has(.gantt-task-bar[data-entity-type="main_task"][data-task-kind="summary"]) .wx-progress-wrapper {
  display: none;
}
.gantt-task-bar[data-entity-type="project"]::before,
.gantt-task-bar[data-entity-type="main_task"][data-task-kind="summary"]::before {
  position: absolute;
  inset: 5px 0 3px;
  border-top: 2px solid var(--accent-strong);
  border-right: 2px solid var(--accent-strong);
  border-left: 2px solid var(--accent-strong);
  border-radius: 2px 2px 0 0;
  content: "";
  opacity: 0.82;
}
.tasks-gantt .wx-bar:has(.gantt-task-bar[data-planned-pattern="dash-dot"]) {
  background: transparent;
  box-shadow: none;
}
.gantt-task-bar[data-planned-pattern="dash-dot"]::before {
  position: absolute;
  inset: 0;
  border-radius: 3px;
  background: repeating-linear-gradient(90deg, var(--text-muted) 0 5px, transparent 5px 7px, var(--text-muted) 7px 8px, transparent 8px 11px) top/100% 1px no-repeat,
    repeating-linear-gradient(90deg, var(--text-muted) 0 5px, transparent 5px 7px, var(--text-muted) 7px 8px, transparent 8px 11px) bottom/100% 1px no-repeat;
  content: "";
  opacity: 0.72;
}
.tasks-gantt .wx-baseline {
  height: 4px !important;
  border: 1px dashed var(--accent-strong);
  @supports (color: color-mix(in lab, red, red)) {
    border: 1px dashed color-mix(in oklab, var(--accent-strong) 62%, transparent);
  }
  border-radius: 2px;
  background: transparent !important;
  opacity: 0.72;
}
.tasks-empty-state {
  display: grid;
  height: 100%;
  place-content: center;
  gap: 4px;
  color: var(--text-muted);
  text-align: center;
  font-size: 12px;
}
.tasks-empty-state strong {
  color: var(--text-primary);
  font-size: 13px;
}
.tasks-workspace__unavailable {
  display: flex;
  width: min(360px, calc(100% - 32px));
  margin: 24px auto;
  flex-direction: column;
  gap: 4px;
  padding: 12px;
  border: 1px solid var(--danger);
  @supports (color: color-mix(in lab, red, red)) {
    border: 1px solid color-mix(in oklab, var(--danger) 40%, var(--border-subtle));
  }
  border-radius: var(--radius-md);
  color: var(--text-muted);
  font-size: 12px;
}
.tasks-workspace__unavailable strong {
  color: var(--text-primary);
  font-size: 13px;
}
@keyframes connection-spin {
  to {
    transform: rotate(360deg);
  }
}
@media (max-width: 720px) {
  .app-shell {
    padding: 8px;
  }
  .app-shell__header {
    grid-template-columns: auto 1fr auto;
  }
  .app-shell__brand h1,
  .app-shell__task-count,
  .app-navigation__migration,
  .connection-status span {
    position: absolute;
    width: 1px;
    height: 1px;
    overflow: hidden;
    clip: rect(0 0 0 0);
    white-space: nowrap;
    clip-path: inset(50%);
  }
  .app-shell__brand,
  .app-shell__actions {
    padding-inline: 8px;
  }
}
