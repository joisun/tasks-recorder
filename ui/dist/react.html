  --accent-strong: oklch(0.78 0.14 275);
  --accent-contrast: oklch(0.16 0.025 275);

  --row-height: 36px;
  --control-height: 32px;
  --radius: 8px;
  --background: var(--surface-0);
  --foreground: var(--text-primary);
  --card: var(--surface-1);
  --card-foreground: var(--text-primary);
  --popover: var(--surface-raised);
  --popover-foreground: var(--text-primary);
  --primary: var(--accent);
  --primary-foreground: var(--accent-contrast);
  --secondary: var(--surface-2);
  --secondary-foreground: var(--text-primary);
  --muted: var(--surface-2);
  --muted-foreground: var(--text-muted);
  --accent-foreground: var(--text-primary);

  --border: var(--border-subtle);
  --input: var(--border-strong);
  --ring: var(--accent);
}

@media (prefers-reduced-motion: reduce) {
  *, *::before, *::after {
    scroll-behavior: auto !important;
    animation-duration: 0.01ms !important;
    animation-iteration-count: 1 !important;
    transition-duration: 0.01ms !important;
  }
}
@layer base {
  * {
    border-color: var(--border);
    outline-color: var(--ring);
    @supports (color: color-mix(in lab, red, red)) {
      outline-color: color-mix(in oklab, var(--ring) 50%, transparent);
    }
    box-sizing: border-box;
  }
  html {
    font-family: ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    font-synthesis: none;
  }
  body {
    background-color: var(--background);
    color: var(--foreground);
    min-width: 320px;
    min-height: 100vh;
    margin: 0;
  }
  button:not(:disabled),
  [role="button"]:not(:disabled) {
    cursor: pointer;
  }
}
button,
input,
textarea,
select {
  font: inherit;
}
.app-shell {
  display: grid;
  min-height: 100vh;
  grid-template-rows: 48px minmax(0, 1fr);
  padding: 12px;
  overflow: hidden;
  background: var(--surface-0);
}
.app-shell__header {
  display: grid;
  min-width: 0;
  grid-template-columns: minmax(180px, 1fr) auto minmax(180px, 1fr);
  align-items: center;
  border: 1px solid var(--border-subtle);
  border-bottom: 0;
  border-radius: var(--radius-lg) var(--radius-lg) 0 0;
  background: var(--surface-1);
}
.app-shell__brand,
.app-shell__actions {
  display: flex;
  min-width: 0;
  align-items: center;
  gap: 8px;
  padding-inline: 12px;
}
.app-shell__brand h1 {
  overflow: hidden;
  margin: 0;
  color: var(--text-primary);
  font-size: 13px;
  font-weight: 650;
  letter-spacing: -0.01em;
  text-overflow: ellipsis;
  white-space: nowrap;
}
.app-shell__mark {
  display: grid;
  width: 24px;
  height: 24px;
  flex: 0 0 auto;
  place-items: center;
  border-radius: 6px;
  color: var(--accent-strong);
  background: var(--accent);
  @supports (color: color-mix(in lab, red, red)) {
    background: color-mix(in oklab, var(--accent) 12%, transparent);
  }
}
.app-shell__mark svg {
  width: 14px;
  height: 14px;
}
.app-navigation {
  display: flex;
  height: 32px;
  align-items: center;
  gap: 2px;
  padding: 3px;
  border: 1px solid var(--border-subtle);
  border-radius: 7px;
  background: var(--surface-2);
  @supports (color: color-mix(in lab, red, red)) {
    background: color-mix(in oklab, var(--surface-2) 70%, transparent);
  }
}
.app-navigation__item {
  display: inline-flex;
  height: 24px;
  align-items: center;
  gap: 6px;
  padding: 0 9px;
  border: 0;
  border-radius: 5px;
  color: var(--text-muted);
  background: transparent;
  font-size: 12px;
  font-weight: 580;
  white-space: nowrap;
}
.app-navigation__item svg {
  width: 13px;
  height: 13px;
}
.app-navigation__item.is-active {
  color: var(--text-primary);
  background: var(--surface-raised);
  box-shadow: 0 1px 2px oklch(0.05 0.01 260 / 18%);
}
.app-navigation__item:focus-visible {
  outline: 2px solid var(--accent);
  @supports (color: color-mix(in lab, red, red)) {
    outline: 2px solid color-mix(in oklab, var(--accent) 72%, transparent);
  }
  outline-offset: 1px;
}
.app-navigation__item:disabled {
  cursor: default;
  opacity: 0.48;
}
.app-navigation__migration {
  color: var(--text-muted);
  font-size: 10px;
  font-weight: 500;
}
.app-shell__actions {
  justify-content: flex-end;
}
.app-shell__task-count {
  color: var(--text-muted);
  font-size: 11px;
  font-variant-numeric: tabular-nums;
  white-space: nowrap;
}
.connection-status {
  display: inline-flex;
  height: 26px;
  align-items: center;
  gap: 5px;
  padding: 0 7px;
  border-radius: 6px;
  color: var(--text-muted);
  font-size: 11px;
  white-space: nowrap;
}
.connection-status svg {
  width: 12px;
  height: 12px;
}
.connection-status[data-state="open"] svg {
  color: var(--success);
}
.connection-status[data-state="connecting"] svg {
  color: var(--warning);
  animation: connection-spin 1.1s linear infinite;
}
.connection-status[data-state="closed"] svg {
  color: var(--danger);
}
.app-shell__main {
  min-width: 0;
  min-height: 0;
  overflow: hidden;
  border: 1px solid var(--border-subtle);
  border-radius: 0 0 var(--radius-lg) var(--radius-lg);
  background: var(--surface-1);
}
.tasks-workspace {
  width: 100%;
  height: 100%;
  min-height: 0;
}
.tasks-workspace__unavailable {
  display: flex;
  width: min(360px, calc(100% - 32px));
  margin: 24px auto;
  flex-direction: column;
  gap: 4px;
  padding: 12px;
  border: 1px solid var(--danger);
  @supports (color: color-mix(in lab, red, red)) {
    border: 1px solid color-mix(in oklab, var(--danger) 40%, var(--border-subtle));
  }
  border-radius: var(--radius-md);
  color: var(--text-muted);
  font-size: 12px;
}
.tasks-workspace__unavailable strong {
  color: var(--text-primary);
  font-size: 13px;
}
@keyframes connection-spin {
  to {
    transform: rotate(360deg);
  }
}
@media (max-width: 720px) {
  .app-shell {
    padding: 8px;
  }
  .app-shell__header {
    grid-template-columns: auto 1fr auto;
  }
  .app-shell__brand h1,
  .app-shell__task-count,
  .app-navigation__migration,
  .connection-status span {
    position: absolute;
    width: 1px;
    height: 1px;
    overflow: hidden;
    clip: rect(0 0 0 0);
    white-space: nowrap;
    clip-path: inset(50%);
  }
  .app-shell__brand,
  .app-shell__actions {
    padding-inline: 8px;
  }
}
